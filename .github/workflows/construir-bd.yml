name: Construir base lingüística española
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/construir-bd.yml'
permissions:
  contents: write
concurrency:
  group: bd-linguistica
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extraer fuentes
        run: |
          python scripts/extraer_corpus.py || test -s catalogo/resultado.json
          python -c "import json; r=json.load(open('catalogo/resultado.json')); a=[x for x in r['obras'] if x['formato']!='gutenberg']; assert len(a)==140 and all(x['estado']=='extraido' for x in a), 'Falló una fuente fijada por hash'"
      - name: Construir SQLite léxico observado
        run: python scripts/indice_lexico.py
      - name: Guardar SQLite léxico
        uses: actions/upload-artifact@v4
        with:
          name: base-lexica-espanola
          path: |
            salida/lexico.sqlite
            salida/informe_lexico.json
          retention-days: 90
      - name: Publicar índice y textos verificados
        run: |
          mkdir -p bd/datos
          gzip -n -c salida/lexico.sqlite | split -b 45m -d -a 3 - bd/datos/lexico.sqlite.gz.part-
          (cd bd/datos && sha256sum lexico.sqlite.gz.part-* > SHA256SUMS)
          cp salida/informe_lexico.json bd/datos/informe_lexico.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bd/datos corpus/txt/conha-* corpus/txt/eltec-* corpus/txt/oro-* catalogo/resultado.json catalogo/resultado.csv
          if ! git diff --cached --quiet; then git commit -m "Publicar base léxica real y corpus normalizado verificado"; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Instalar anotador español
        run: |
          python -m pip install -r requirements.txt
          python -m pip install https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl
      - name: Construir SQLite morfosintáctico
        run: python scripts/construir_bd.py
      - name: Publicar base lingüística completa
        uses: actions/upload-artifact@v4
        with:
          name: base-linguistica-espanola
          path: |
            salida/espanol.sqlite
            salida/informe.json
          retention-days: 90
          compression-level: 6
      - name: Publicar informe NLP
        run: |
          cp salida/informe.json bd/datos/informe_nlp.json
          git add bd/datos/informe_nlp.json
          if ! git diff --cached --quiet; then git commit -m "Publicar métricas verificadas del corpus anotado"; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
